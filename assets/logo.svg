<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 50" height="38" fill="none" class="brand-logo-svg">
  <defs>
    <linearGradient id="brandNexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="45%" stop-color="#B9A9F2" />
      <stop offset="100%" stop-color="#9A85EC" />
    </linearGradient>
    <linearGradient id="brandFinanceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A85EC" />
      <stop offset="55%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7C3AED" flood-opacity="0.35" />
    </filter>
  </defs>
  <g filter="url(#brandGlow)">
    <image href="data:image/png;base64," x="0" y="3" width="34" height="44" preserveAspectRatio="xMidYMid meet" />
  </g>
  <text x="42" y="35" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" fill="url(#brandNexGrad)" letter-spacing="-0.5">Nex<tspan font-weight="600" fill="url(#brandFinanceGrad)" letter-spacing="-0.2">Finance</tspan></text>
</svg>